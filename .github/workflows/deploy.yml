name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write # autorise l'action à pousser sur gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
